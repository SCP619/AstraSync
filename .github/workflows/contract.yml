name: Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: astrasync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend lint, types and tests
        working-directory: traficom-integration/backend
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
          ruff check .
          mypy
          python -m astrasync_api.contract.export --check
          python -m pytest
          ASTRASYNC_TEST_DATABASE_URL=postgresql+psycopg://postgres:ci-only@localhost:5432/astrasync_test python -m pytest
      - name: UI contract check
        working-directory: traficom-integration/ui
        run: |
          npm ci
          npm run contract:check
          npm test
          npm run build
