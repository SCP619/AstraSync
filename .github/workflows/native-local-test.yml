name: Native local test builds

# Packages that talk only to the local test stack on 127.0.0.1. For device testing, not release:
# they are unsigned, and the Android one is a debug build. See traficom-integration/ui/DEVICE_TESTING.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-local-test.yml"
      - "traficom-integration/ui/**"

permissions:
  contents: read

env:
  VITE_API_BASE_URL: http://127.0.0.1:8800
  VITE_OIDC_AUTHORITY: http://127.0.0.1:8801
  VITE_OIDC_CLIENT_ID: astrasync-dev-ui
  VITE_OIDC_SCOPE: openid astrasync.api

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: traficom-integration/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tauri build --config src-tauri/tauri.local-test.conf.json --features devtools
      - uses: actions/upload-artifact@v4
        with:
          name: astrasync-windows-LOCAL-TEST
          path: traficom-integration/ui/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traficom-integration/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: sh ./gradlew assembleDebug
        working-directory: traficom-integration/ui/android
      - uses: actions/upload-artifact@v4
        with:
          name: astrasync-android-LOCAL-TEST
          path: traficom-integration/ui/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
