[project]
name = "astrasync-core"
version = "0.1.0"
description = "AstraSync source parsers and RF methods (Data/RF/AI track)"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<0.8",  # openpyxl uses it to refuse unsafe XML.
    "openpyxl>=3.1.5,<3.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["data"]
include = ["astrasync_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["data/astrasync_data"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
