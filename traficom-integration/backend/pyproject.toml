[project]
name = "astrasync-api"
version = "0.1.0"
description = "AstraSync FastAPI backend and shared API contract"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "duckdb>=1.5,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=25,<26",
    "pydantic>=2.9,<3",
    "pyjwt[crypto]>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "python-multipart>=0.0.9,<1",
    "pytest>=9.0.3,<10",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrasync_api*"]

[tool.setuptools.package-data]
astrasync_api = ["migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# FastAPI's Depends/Query defaults are its documented idiom; asserts are fine in tests.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["astrasync_api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
