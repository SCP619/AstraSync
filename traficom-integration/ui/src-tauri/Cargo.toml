[package]
name = "astrasync-desktop"
version = "0.1.0"
description = "AstraSync Windows client"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Local test builds only: lets a tester open the WebView developer tools.
devtools = ["tauri/devtools"]

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
